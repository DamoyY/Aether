[package]
name = "Aether"
version = "0.0.0"
edition = "2024"
build = "build.rs"

[dependencies]
scene_box = { path = "../scene_box" }
cudarc = { version = "*", features = ["cuda-13010"] }
winit = "*"
pixels = "*"
serde = { version = "*", features = ["derive"] }
serde_yaml = "*"
glam = "*"
bytemuck = { version = "*", features = ["derive"] }
anyhow = "*"
log = "*"
env_logger = "*"
rand = "*"
image = { version = "*", default-features = false, features = ["png"] }
ctrlc = "*"
mimalloc = "*"

[build-dependencies]
glob = "*"

[lints]
workspace = true
