render:
  width: 1280
  height: 720
  max_bounces: 16
  target_samples: 50

camera:
  position: [3.0, 2.0, 3.0]
  target: [0.0, 0.0, 0.0]
  up: [0.0, 1.0, 0.0]
  fov: 60.0

light:
  position: [2.0, 3.0, 2.0]
  color: [1.0, 1.0, 1.0]
  intensity: 10.0

voxel:
  dimensions: [64, 64, 64]
  voxel_size: 0.03125
  origin: [-1.0, -1.0, -1.0]

material:
  sigma_a: [0.01, 0.05, 0.1]
  sigma_s: [1.0, 0.8, 0.6]
  anisotropy: 0.8
  ior: 1.3

scene:
  background: [0.1, 0.1, 0.1]

window:
  title: "Voxel SSS Renderer"
