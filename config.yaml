render:
  width: 1280
  height: 720
  max_bounces: 12
  target_samples: 10000
  samples_per_frame: 100

camera:
  position: [3.0, 2.0, 3.0]
  target: [0.0, 0.0, 0.0]
  up: [0.0, 1.0, 0.0]
  fov: 60.0

light:
  position: [2.0, 3.0, 2.0]
  color: [1.0, 1.0, 1.0]
  intensity: 10.0

voxel:
  dimensions: [64, 64, 64]
  voxel_size: 0.03125
  origin: [-1.0, -1.0, -1.0]

material:
  sigma_a: [0.002, 0.002, 0.005]
  sigma_s: [3.0, 3.0, 2.8]
  anisotropy: 0.85
  ior: 1.49

scene:
  background: [0.1, 0.1, 0.1]

window:
  title: "Voxel SSS Renderer"
