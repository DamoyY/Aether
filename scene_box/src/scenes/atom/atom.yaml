camera:
  height: 1
  radius: 1
  angle: 0
  fov: 60.0

light:
  height: 1
  radius: 1
  angle: 0
  color: [1.0, 1.0, 1.0]
  intensity: 150000.0

voxel:
  dimensions: [512, 512, 512]
  voxel_size: 0.25

material:
  anisotropy: 0.8
  ior: 1.42
  # 色相配置：根据波函数 ψ 的正负值决定颜色
  ## 正极值色相（范围 0-360）
  hue_positive: 60.
  ## 负极值色相（范围 0-360）
  hue_negative: 240.0
  ## 饱和度 [0, 1]
  saturation: 1
  ## 明度 [0, 1]
  value: 1
  ## 基础消光系数
  base_sigma_t: 0.05

background: [0.0, 0.0, 0.0]

orbital:
  n_quantum: 4
  l_quantum: 0
  m_quantum: 0
  z_charge: 1.0
