camera:
  position: [4.0, 3.0, 4.0]
  target: [1.0, 1.0, 1.0]
  up: [0.0, 1.0, 0.0]
  fov: 60.0

light:
  position: [2.0, 2.5, 3.0]
  color: [1.5, 1.2, 1.0]
  intensity: 5.0

voxel:
  dimensions: [64, 64, 64]
  voxel_size: 0.03125

material:
  # 降低各向异性，让光线在内部多停留一会，产生胶质感
  anisotropy: 0.6
  # 果冻含水量高，折射率比玻璃/塑料低，1.35-1.40 会更水润
  ior: 1.38

gradient:
  # 为了模拟果冻的均匀质感，建议 top 和 bottom 数值接近，
  # 或者让底部稍微混浊一点点（模拟沉淀）
  bottom:
    # 吸收：红光通过(低值)，绿蓝光被吸收(高值) -> 呈现深红色
    sigma_a: [0.1, 2.0, 4.0]
    # 散射：适中，保证光能透进去但又有体积感
    sigma_s: [1.5, 1.5, 1.5]
  top:
    # 顶部稍微清透一点（吸收少一点，散射少一点）
    sigma_a: [0.05, 1.5, 3.0]
    sigma_s: [1.2, 1.2, 1.2]

background: [0.05, 0.07, 0.1]

generator:
  center: [1.0, 1.0, 1.0]
  half_size: 1.0
